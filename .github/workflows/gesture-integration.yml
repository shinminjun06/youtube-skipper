name: BlockBlast Android gesture integration
on:
  workflow_dispatch:
jobs:
  emulator-gesture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Test real Android screen capture and accessibility gestures on fixture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            bash tools/device-check.sh
      - name: Upload device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAuto-device-evidence
          path: |
            build/device-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
