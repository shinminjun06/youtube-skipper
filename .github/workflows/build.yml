name: Create Advanced EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Libraries
      run: pip install selenium pyinstaller
    - name: Build EXE
      run: pyinstaller --onefile --noconsole --collect-all selenium skipper.py
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Advanced-YouTube-Skipper
        path: dist/skipper.exe
