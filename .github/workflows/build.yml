name: Build BlockBlast APK
on:
  push:
    branches: [blockblast-auto-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core regression checks (real screenshot fixtures)
        run: bash tools/check-core.sh
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Native capture and continued-drag tests (controlled fixture)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            bash tools/device-check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAuto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAuto-verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            build/device-evidence/
