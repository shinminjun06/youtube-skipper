name: Build BlockBlast APK
on:
  push:
    branches: [blockblast-auto-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Core regression checks (real screenshot fixtures)
        run: bash tools/check-core.sh
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: Verify APK and record source revision
        run: |
          mkdir -p build/apk
          cp app/build/outputs/apk/debug/app-debug.apk build/apk/BlockBlastAuto-v0.4.apk
          printf '%s\n' "$GITHUB_SHA" > build/apk/SOURCE_COMMIT.txt
          sha256sum build/apk/BlockBlastAuto-v0.4.apk > build/apk/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/apk/BlockBlastAuto-v0.4.apk > build/apk/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions build/apk/BlockBlastAuto-v0.4.apk > build/apk/PERMISSIONS.txt
          if rg -q android.permission.INTERNET build/apk/PERMISSIONS.txt; then exit 1; fi
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Native capture and continued-drag tests (controlled fixture)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            bash tools/device-check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAuto-debug-apk
          path: build/apk/
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAuto-verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            build/device-evidence/
