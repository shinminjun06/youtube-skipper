name: Build BlockBlast Advisor + Auto APK
on:
  push:
    branches: [blockblast-autoplay-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Core regression checks (real screenshot fixtures)
        run: bash tools/check-core.sh
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: Verify APK and record source revision
        run: |
          mkdir -p build/apk
          cp app/build/outputs/apk/debug/app-debug.apk build/apk/BlockBlastAutoPlay-v1.4.4.apk
          printf '%s\n' "$GITHUB_SHA" > build/apk/SOURCE_COMMIT.txt
          sha256sum build/apk/BlockBlastAutoPlay-v1.4.4.apk > build/apk/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/apk/BlockBlastAutoPlay-v1.4.4.apk > build/apk/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/apk/BlockBlastAutoPlay-v1.4.4.apk > build/apk/APK_INFO.txt
          grep -F "package: name='com.pivotry.blockauto.autoplay' versionCode='38' versionName='1.4.4'" build/apk/APK_INFO.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions build/apk/BlockBlastAutoPlay-v1.4.4.apk > build/apk/PERMISSIONS.txt
          if rg -q android.permission.INTERNET build/apk/PERMISSIONS.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAutoPlay-apk
          path: build/apk/
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAuto-verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            build/device-evidence/
